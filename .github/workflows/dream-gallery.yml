name: Autonomous Dream Gallery

on:
  schedule:
    - cron: '0 3 * * 1'  # Cada lunes a las 03:00 UTC
  workflow_dispatch:     # Permite ejecucion manual

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Run diversity tests
        run: python -m unittest discover tests/ -v
        
      - name: Generate gallery images (4 dreams)
        run: |
          python scripts/generate_gallery.py
          python scripts/generate_gallery.py
          python scripts/generate_gallery.py
          python scripts/generate_gallery.py
          
      - name: Commit gallery updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gallery/
          git diff --staged --quiet || git commit -m "Auto-update: new dream gallery $(date +%Y-%m-%d)"
          git push

  deploy-pages:
    needs: generate-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

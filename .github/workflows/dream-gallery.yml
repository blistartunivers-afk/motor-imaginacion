name: Autonomous Dream Gallery

on:
  schedule:
    - cron: '0 3 * * 1'  # Cada lunes a las 03:00 UTC
  workflow_dispatch:     # Permite ejecución manual

# El deploy lo hace `pages-deploy.yml` (push a master/main).
# Aquí solo generamos sueños y commiteamos. Una sola fuente de deploy.
permissions:
  contents: write

# Evita carreras si una ejecución manual se solapa con la programada.
concurrency:
  group: dream-gallery
  cancel-in-progress: false

jobs:
  generate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (con caché de pip)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run diversity tests
        run: python -m unittest discover tests/ -v

      - name: Generate 8 dream PNGs (512x512, paleta perceptualmente uniforme)
        # Una sola corrida con --count 8 + --update-index reescribe INDEX.txt
        # con todos los archivos (incluyendo legacy .pgm).
        # Default: viridis. Para rotar, edita la linea --palette abajo:
        #   viridis | magma | plasma | inferno | turbo | raw
        run: >-
          python scripts/generate_gallery.py
          --count 8
          --width 512
          --height 512
          --format png
          --out-dir gallery
          --palette viridis
          --update-index

      - name: Commit gallery updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gallery/
          git diff --staged --quiet || git commit -m "Auto-update: 8 new dream gallery $(date +%Y-%m-%d)"
          git push

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Galeria de Suenos Autonoma</title>
    <style>
        :root {
            --neon: #00ffaa;
            --neon-dim: #008866;
            --cyan: #00ccff;
            --bg: #0a0a0a;
            --panel: #111;
            --accent: #ff00aa;
            --glow: 0 0 10px var(--neon), 0 0 20px var(--neon);
        }
        [data-palette="cyberpunk"] {
            --neon: #ffea00;
            --neon-dim: #b89c00;
            --cyan: #ff0099;
            --bg: #0a0014;
            --panel: #1a0028;
            --accent: #ff0099;
        }
        [data-palette="sunset"] {
            --neon: #ff8855;
            --neon-dim: #aa4422;
            --cyan: #ffcc66;
            --bg: #1a0a14;
            --panel: #2a1018;
            --accent: #ff5588;
        }
        [data-palette="forest"] {
            --neon: #88dd44;
            --neon-dim: #447722;
            --cyan: #aaffaa;
            --bg: #050a08;
            --panel: #0d1810;
            --accent: #44ffaa;
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--neon);
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            text-align: center;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* === FONDO DE PARTÍCULAS (CSS puro) === */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 20% 30%, var(--neon), transparent),
                radial-gradient(1px 1px at 60% 70%, var(--cyan), transparent),
                radial-gradient(1px 1px at 80% 20%, var(--neon), transparent),
                radial-gradient(1px 1px at 40% 80%, var(--cyan), transparent),
                radial-gradient(1px 1px at 90% 50%, var(--neon), transparent),
                radial-gradient(1px 1px at 10% 60%, var(--cyan), transparent),
                radial-gradient(1px 1px at 50% 10%, var(--neon), transparent),
                radial-gradient(1px 1px at 30% 90%, var(--cyan), transparent);
            background-size: 200% 200%;
            animation: drift 60s linear infinite;
            pointer-events: none;
            opacity: 0.5;
            z-index: 0;
        }
        @keyframes drift {
            from { background-position: 0% 0%; }
            to   { background-position: 200% 200%; }
        }

        /* === SCANLINES CRT GLOBALES === */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 170, 0.03) 0px,
                rgba(0, 255, 170, 0.03) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 1;
            animation: scanMove 8s linear infinite;
        }
        @keyframes scanMove {
            from { background-position: 0 0; }
            to   { background-position: 0 100vh; }
        }

        h1 {
            position: relative;
            z-index: 2;
            font-size: 2.5em;
            text-shadow: 0 0 10px var(--neon), 0 0 20px var(--neon);
            margin-bottom: 5px;
            animation: glow 3s ease-in-out infinite alternate, glitchTitle 8s steps(1) infinite;
        }
        @keyframes glow {
            from { text-shadow: 0 0 10px var(--neon), 0 0 20px var(--neon); }
            to   { text-shadow: 0 0 20px var(--neon), 0 0 40px var(--neon), 0 0 60px var(--cyan); }
        }
        @keyframes glitchTitle {
            0%, 92%, 100%   { transform: translate(0, 0); filter: none; }
            93%             { transform: translate(-2px, 1px); filter: hue-rotate(90deg); }
            94%             { transform: translate(2px, -1px); filter: hue-rotate(-90deg); }
            95%             { transform: translate(-1px, -1px); filter: hue-rotate(180deg); }
            96%             { transform: translate(1px, 1px); filter: none; }
        }

        p.subtitle {
            position: relative;
            z-index: 2;
            color: var(--neon-dim);
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid var(--neon);
            width: 0;
            margin: 0 auto 30px;
            animation: typing 3.5s steps(50) 0.5s forwards, blink 0.7s step-end infinite 4s;
        }
        @keyframes typing {
            from { width: 0; }
            to   { width: 100%; max-width: 700px; }
        }
        @keyframes blink {
            50% { border-color: transparent; }
        }

        .gallery {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .dream {
            --i: 0;
            border: 2px solid var(--neon);
            border-radius: 8px;
            padding: 10px;
            background: var(--panel);
            box-shadow: 0 0 15px rgba(0, 255, 170, 0.33);
            position: relative;
            overflow: hidden;
            animation: fadeInGlitch 1.2s ease-out both;
            animation-delay: calc(var(--i) * 0.2s);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .dream:hover {
            transform: scale(1.04) translateY(-4px);
            box-shadow: 0 0 30px var(--neon), 0 0 50px rgba(0, 255, 170, 0.5);
            z-index: 3;
        }
        /* Scanline personalizada en hover */
        .dream:hover::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                transparent 0%,
                rgba(0, 255, 170, 0.15) 50%,
                transparent 100%
            );
            animation: scanlineHover 1.5s linear infinite;
            pointer-events: none;
            mix-blend-mode: screen;
        }
        @keyframes scanlineHover {
            from { transform: translateY(-100%); }
            to   { transform: translateY(100%); }
        }

        .dream canvas {
            width: 100%;
            height: auto;
            image-rendering: pixelated;
            border-radius: 4px;
            display: block;
            filter: contrast(1.05) saturate(1.1);
        }

        .dream p {
            margin: 8px 0 0;
            font-size: 0.85em;
            color: var(--neon-dim);
            letter-spacing: 0.5px;
        }

        /* === GLITCH REVEAL EN ENTRADA === */
        @keyframes fadeInGlitch {
            0%   { opacity: 0; transform: translateY(20px) scale(0.95); filter: hue-rotate(180deg) blur(4px); }
            20%  { opacity: 1; transform: translateY(0) scale(1); filter: hue-rotate(90deg) blur(0); }
            25%  { transform: translateX(-3px); }
            30%  { transform: translateX(3px); }
            35%  { transform: translateX(0); filter: none; }
            100% { opacity: 1; transform: translateX(0); filter: none; }
        }

        /* === GLITCH ALEATORIO CONTINUO EN DREAMS === */
        .dream::before {
            content: '';
            position: absolute;
            inset: 0;
            background: inherit;
            opacity: 0;
            pointer-events: none;
        }
        .dream.glitching {
            animation: fadeInGlitch 1.2s ease-out both, microGlitch 0.3s steps(2) 4s infinite;
            animation-delay: calc(var(--i) * 0.2s), 4s;
        }
        @keyframes microGlitch {
            0%, 90%, 100% { filter: none; }
            92% { filter: hue-rotate(60deg) saturate(2); transform: translate(1px, 0); }
            94% { filter: hue-rotate(-60deg) saturate(2); transform: translate(-1px, 0); }
            96% { filter: none; transform: translate(0, 1px); }
        }

        .footer {
            position: relative;
            z-index: 2;
            margin-top: 40px;
            font-size: 0.9em;
            color: var(--neon-dim);
            animation: fadeInGlitch 1.5s ease-out 2s both;
        }
        a {
            color: var(--cyan);
            text-decoration: none;
            border-bottom: 1px dashed var(--cyan);
            transition: all 0.2s;
        }
        a:hover {
            color: var(--neon);
            border-bottom-style: solid;
            text-shadow: 0 0 8px var(--neon);
        }

        /* === STATUS BAR (loader inicial) === */
        #status {
            position: relative;
            z-index: 2;
            color: var(--cyan);
            font-size: 0.9em;
            margin: 20px auto;
            display: inline-block;
            padding: 5px 15px;
            border: 1px solid var(--cyan);
            border-radius: 20px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 5px var(--cyan); }
            50%      { opacity: 0.6; box-shadow: 0 0 20px var(--cyan); }
        }

        /* === SELECTOR DE PALETAS === */
        #palette-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            gap: 8px;
            background: rgba(0,0,0,0.6);
            padding: 8px;
            border: 1px solid var(--neon-dim);
            border-radius: 30px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            animation: fadeInGlitch 1s ease-out 1.5s both;
        }
        .palette-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
        }
        .palette-btn:hover {
            transform: scale(1.25);
            box-shadow: 0 0 12px currentColor;
        }
        .palette-btn.active {
            border-color: #fff;
            box-shadow: 0 0 10px var(--neon);
            transform: scale(1.15);
        }
        .palette-btn[data-set="neon"]      { background: linear-gradient(135deg, #00ffaa, #00ccff); }
        .palette-btn[data-set="cyberpunk"] { background: linear-gradient(135deg, #ffea00, #ff0099); }
        .palette-btn[data-set="sunset"]    { background: linear-gradient(135deg, #ff8855, #ffcc66); }
        .palette-btn[data-set="forest"]    { background: linear-gradient(135deg, #88dd44, #aaffaa); }

        /* === CURSOR PARALLAX 3D === */
        .gallery {
            perspective: 1200px;
        }
        .dream {
            transform-style: preserve-3d;
            will-change: transform;
        }
        .dream::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(
                300px circle at var(--mx, 50%) var(--my, 50%),
                rgba(255,255,255,0.12),
                transparent 60%
            );
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
            mix-blend-mode: screen;
        }
        .dream:hover::after {
            opacity: 1;
        }

        /* === MODAL ZOOM === */
        #modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            cursor: zoom-out;
            animation: modalIn 0.3s ease-out;
        }
        #modal.active { display: flex; }
        @keyframes modalIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        #modal-content {
            max-width: 92vw;
            max-height: 88vh;
            position: relative;
            animation: modalPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes modalPop {
            from { transform: scale(0.5); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }
        #modal-canvas {
            width: 100%;
            height: auto;
            max-height: 88vh;
            image-rendering: pixelated;
            border: 2px solid var(--neon);
            border-radius: 8px;
            box-shadow: 0 0 40px var(--neon), 0 0 80px rgba(0,255,170,0.3);
            cursor: zoom-out;
        }
        #modal-caption {
            text-align: center;
            margin-top: 12px;
            color: var(--neon);
            font-size: 1em;
            letter-spacing: 1px;
            text-shadow: 0 0 8px var(--neon);
        }
        #modal-close {
            position: absolute;
            top: -40px;
            right: 0;
            color: var(--neon);
            font-size: 1.5em;
            cursor: pointer;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--neon);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        #modal-close:hover {
            transform: rotate(90deg) scale(1.15);
            box-shadow: 0 0 15px var(--neon);
        }

        /* === META PANEL (Fase 2) === */
        .meta-chip {
            display: inline-block;
            padding: 5px 12px;
            border: 1px solid var(--cyan);
            border-radius: 14px;
            color: var(--cyan);
            background: rgba(0, 204, 255, 0.05);
            letter-spacing: 0.5px;
        }
        .meta-chip b { color: var(--neon); margin-left: 4px; }
        .meta-chip a { border-bottom: none; }

        /* === FILTRO POR PALETA === */
        .filter-btn {
            display: inline-block;
            padding: 4px 10px;
            border: 1px solid var(--neon-dim);
            border-radius: 12px;
            color: var(--neon-dim);
            background: transparent;
            font-family: inherit;
            font-size: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn:hover { color: var(--neon); border-color: var(--neon); }
        .filter-btn.active {
            color: var(--bg);
            background: var(--neon);
            border-color: var(--neon);
            box-shadow: 0 0 8px var(--neon);
        }
        .dream[data-palette-mismatch="true"] {
            opacity: 0.18;
            filter: grayscale(0.7);
            transition: opacity 0.3s;
        }
        .dream[data-palette-mismatch="true"]:hover { opacity: 0.5; }
    </style>
</head>
<body>
    <h1>Galeria de Suenos CPPN</h1>
    <p class="subtitle">Arte generativo autonomo cultivado semanalmente por GitHub Actions</p>

    <!-- Panel de Fase 2: paleta + entropía espacial del INDEX -->
    <div id="meta-panel" style="position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:10px auto 6px;font-size:0.85em;">
        <span id="meta-palette" class="meta-chip">paleta: <b>—</b></span>
        <span id="meta-entropy" class="meta-chip">entropía espacial: <b>—</b></span>
        <span id="meta-count"   class="meta-chip">sueños: <b>—</b></span>
        <span id="meta-link"    class="meta-chip"><a href="motor-imaginacion.html" target="_blank">⚡ re-sueño interactivo</a></span>
    </div>

    <!-- Filtro por paleta (lee del INDEX) -->
    <div id="filter-bar" style="position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 auto 14px;font-size:0.8em;"></div>

    <div id="status"></div>
    <div class="gallery" id="gallery"></div>
    <p class="footer">
        Motor de imaginacion autonoma - <a href="https://github.com/blistartunivers-afk/motor-imaginacion">Repositorio</a>
    </p>

    <!-- Selector de paletas -->
    <div id="palette-bar">
        <div class="palette-btn active" data-set="neon"      title="Neón"></div>
        <div class="palette-btn"        data-set="cyberpunk" title="Cyberpunk"></div>
        <div class="palette-btn"        data-set="sunset"    title="Sunset"></div>
        <div class="palette-btn"        data-set="forest"    title="Forest"></div>
    </div>

    <!-- Modal zoom fullscreen -->
    <div id="modal">
        <div id="modal-content">
            <div id="modal-close">✕</div>
            <canvas id="modal-canvas"></canvas>
            <div id="modal-caption"></div>
        </div>
    </div>

    <script src="dream-loader.v2.js?v=003"></script>
</body>
</html>

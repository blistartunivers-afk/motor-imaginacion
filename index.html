<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Galeria de Suenos Autonoma</title>
    <style>
        body {
            background: #0a0a0a;
            color: #00ffaa;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 2.5em;
            text-shadow: 0 0 10px #00ffaa;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .dream {
            border: 2px solid #00ffaa;
            border-radius: 8px;
            padding: 10px;
            background: #111;
            box-shadow: 0 0 15px #00ffaa55;
        }
        .dream img {
            width: 100%;
            height: auto;
            image-rendering: pixelated;
            border-radius: 4px;
        }
        .footer {
            margin-top: 40px;
            font-size: 0.9em;
            color: #008866;
        }
        a { color: #00ccff; }
    </style>
</head>
<body>
    <h1>Galeria de Suenos CPPN</h1>
    <p>Arte generativo autonomo cultivado semanalmente por GitHub Actions</p>
    <div class="gallery" id="gallery"></div>
    <p class="footer">
        Motor de imaginacion autonoma - <a href="https://github.com/blistartunivers-afk/motor-imaginacion">Repositorio</a>
    </p>
    <script>
        // Listar las imagenes reales que existen en gallery/
        fetch('gallery/INDEX.txt').then(r => r.text()).then(txt => {
            const files = txt.split('\n').filter(f => f.trim().endsWith('.pgm'));
            const gallery = document.getElementById('gallery');
            files.forEach(file => {
                const div = document.createElement('div');
                div.className = 'dream';
                div.innerHTML = `<img src="gallery/${file}" alt="${file}"><p>${file}</p>`;
                gallery.appendChild(div);
            });
        }).catch(e => {
            document.getElementById('gallery').innerHTML = '<p>Galeria aun sin suenos. Espera al primer ciclo semanal.</p>';
        });
    </script>
</body>
</html>
